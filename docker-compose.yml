services:
  web:
    build:
      context: .
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "5174:8080"
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-host.docker.internal:8080}
    extra_hosts:
      # Docker Desktop provides this name automatically; Linux hosts do not.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
